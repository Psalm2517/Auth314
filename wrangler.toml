# Cloudflare Workers deployment.
#
# You should not need to edit this file. Configuration is set as secrets, via
# `npm run setup` or the Cloudflare dashboard. See .dev.vars.example.
name = "auth314"
main = "src/worker.ts"
compatibility_date = "2024-06-01"

# Wrangler creates this namespace on first deploy and writes the id back here.
# To bind an existing one instead, add: id = "<your namespace id>"
[[kv_namespaces]]
binding = "AUTH314_KV"
