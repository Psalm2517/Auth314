# Cloudflare Workers deployment. See src/adapters/vercel for Vercel.
name = "auth314"
main = "src/adapters/cloudflare/index.ts"
compatibility_date = "2024-06-01"

# --- KV namespace binding ---
# Create your own namespace first:
#   npx wrangler kv namespace create AUTH314_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "AUTH314_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
# Your Pi OAuth client id, from the Pi Developer Portal. Public value.
PI_CLIENT_ID = "REPLACE_WITH_YOUR_PI_CLIENT_ID"
# Optional. Only set this if the public URL differs from the request Host
# (e.g. behind a proxy). Otherwise the request origin is used.
# PUBLIC_URL = "https://auth.example.com"

# --- Secrets (do NOT put these here) ---
# Set with:
#   npx wrangler secret put AUTH_SECRET
